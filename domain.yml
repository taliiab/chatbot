version: "3.1"

intents:
  - saudacao
  - finalizacao
  - agradecimento
  - informar_nome
  - fazer_pedido
  - visualizar_pedidos
  - falar_empresa
  - informar_quantidade
  - informar_rua
  - informar_numero
  - informar_bairro
  - informar_cep
  - informar_complemento
  - informar_endereco
  - informar_data
  - confirmar
  - negar
  - alterar_pedido
  - cancelar_pedido
  - alterar_endereco_completo
  - pagamento_pix
  - pagamento_dinheiro
  - pagamento_credito
  - pagamento_debito
  - produto_extra
  - produto_jumbo
  - alterar_produto
  - alterar_quantidade
  - alterar_rua
  - alterar_numero
  - alterar_data
  - alterar_pagamento
  - fazer_pagamento

entities: []

actions:
  - action_verificar_cliente
  - action_salvar_nome_cliente
  - action_iniciar_pedido
  - action_calcular_valores_pedido
  - action_salvar_pedido_banco
  - action_buscar_pedidos_banco
  - action_cancelar_pedido_banco
  - action_limpar_slot_para_alterar

slots:
  produto:
    type: text
    influence_conversation: true
    mappings:
      - type: from_intent
        intent: produto_extra
        value: extra
        conditions:
          - active_loop: fechar_pedido_form
            requested_slot: produto

      - type: from_intent
        intent: produto_jumbo
        value: jumbo
        conditions:
          - active_loop: fechar_pedido_form
            requested_slot: produto

  quantidade:
    type: text
    influence_conversation: true
    mappings:
      - type: from_text
        conditions:
          - active_loop: fechar_pedido_form
            requested_slot: quantidade

  rua:
    type: text
    influence_conversation: true
    mappings:
      - type: from_text
        conditions:
          - active_loop: fechar_pedido_form
            requested_slot: rua

  numero:
    type: text
    influence_conversation: true
    mappings:
      - type: from_text
        conditions:
          - active_loop: fechar_pedido_form
            requested_slot: numero

  bairro:
    type: text
    influence_conversation: true
    mappings:
      - type: from_text
        conditions:
          - active_loop: fechar_pedido_form
            requested_slot: bairro

  cep:
    type: text
    influence_conversation: true
    mappings:
      - type: from_text
        conditions:
          - active_loop: fechar_pedido_form
            requested_slot: cep

  complemento:
    type: text
    influence_conversation: true
    mappings:
      - type: from_text
        conditions:
          - active_loop: fechar_pedido_form
            requested_slot: complemento

  data:
    type: text
    influence_conversation: true
    mappings:
      - type: from_text
        conditions:
          - active_loop: fechar_pedido_form
            requested_slot: data

  pagamento:
    type: text
    influence_conversation: true
    mappings:
      - type: from_intent
        intent: pagamento_pix
        value: pix
        conditions:
          - active_loop: fechar_pedido_form
            requested_slot: pagamento

      - type: from_intent
        intent: pagamento_dinheiro
        value: dinheiro
        conditions:
          - active_loop: fechar_pedido_form
            requested_slot: pagamento

      - type: from_intent
        intent: pagamento_credito
        value: credito
        conditions:
          - active_loop: fechar_pedido_form
            requested_slot: pagamento

      - type: from_intent
        intent: pagamento_debito
        value: debito
        conditions:
          - active_loop: fechar_pedido_form
            requested_slot: pagamento

  valor_entrega:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  valor_total:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  campo_alterar:
    type: text
    influence_conversation: true
    mappings:
      - type: from_intent
        intent: alterar_produto
        value: produto

      - type: from_intent
        intent: alterar_quantidade
        value: quantidade

      - type: from_intent
        intent: alterar_rua
        value: rua

      - type: from_intent
        intent: alterar_numero
        value: numero

      - type: from_intent
        intent: alterar_data
        value: data

      - type: from_intent
        intent: alterar_pagamento
        value: pagamento


  nome_cliente:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: fechar_pedido_form
            requested_slot: nome_cliente

  aguardando_nome:
    type: bool
    influence_conversation: true
    mappings:
      - type: custom

forms:
  fechar_pedido_form:
    required_slots:
      - nome_cliente
      - produto
      - quantidade
      - rua
      - numero
      - bairro
      - cep
      - complemento
      - data
      - pagamento

responses:
  utter_saudacao:
    - text: |
        🐔🥚 Olá, seja bem-vindo à Vó Nana Ovos!

        Somos uma empresa comprometida com a produção de ovos de qualidade, vindos de galinhas criadas com mais liberdade, cuidado e bem-estar.

        Acreditamos que um ambiente mais saudável para as aves resulta em produtos mais frescos e saborosos para a sua mesa. 💛

        Como podemos te ajudar hoje?
        • 🥚 Fazer um pedido
        • 📦 Visualizar pedidos (pendentes ou em processo de entrega)
        • 📞 Falar com a empresa

  utter_ask_produto:
    - text: |
        🥚 Ótimo! Conheça nossos produtos:

        1️⃣ Dúzia de ovos extras

        2️⃣ Ovos tipo Jumbo (10 unidades)

        📑 Lembrete:
        Na compra de 5 dúzias (ou 5 caixas jumbo), a entrega será gratuita! 🚚

        Digite o nome do produto que deseja pedir (Extra ou Jumbo):

  utter_ask_quantidade:
    - text: |
        Excelente escolha! 🥚

        Quantas unidades ou caixas você deseja encomendar?

  utter_ask_rua:
    - text: "🏡 Qual é o nome da sua rua ou avenida?"

  utter_ask_numero:
    - text: "🔢 Qual é o número da residência?"

  utter_ask_bairro:
    - text: "📍 Qual é o seu bairro?"

  utter_ask_cep:
    - text: "📮 Qual é o seu CEP? (Se não souber, pode digitar 'Não sei')"

  utter_ask_complemento:
    - text: "🏢 Tem algum complemento? (Ex: Bloco B, Apto 202, Fundos. Se não tiver, digite 'Não')"

  utter_ask_data:
    - text: |
        📅 Qual data você deseja para a entrega?

  utter_ask_pagamento:
    - text: 
        💳 Qual será a forma de pagamento?

         • Pix
         • Dinheiro
         • Crédito
         • Débito

  utter_conferir_pedido:
    - text: |
        📝 Resumo do pedido:

        🥚 Produto: {produto}
        📦 Quantidade: {quantidade}

        🏡 Endereço de Entrega:
        • Rua: {rua}, Nº {numero}
        • Bairro: {bairro}
        • CEP: {cep}
        • Comp.: {complemento}

        📅 Data de entrega: {data}
        💳 Método de pagamento: {pagamento}

        🚚 Valor entrega: R$ {valor_entrega}
        💵 Valor total: R$ {valor_total}

        Você confirma essas informações?
        • ✅  Sim
        • ✏️  Alterar

  utter_pedido_confirmado:
    - text: |
        ✅ Seu pedido foi realizado com SUCESSO!

        Agora é só aguardar, nossa equipe já está preparando! 🐔🥚

        Agradecemos pela preferência! 💛

  utter_alteracao_pedido:
    - text: |
        Qual informação você deseja alterar?

        • 🥚 Produto
        • 📦 Quantidade
        • 🏡 Rua
        • 🔢 Número
        • 📅 Data
        • 💳 Pagamento


  utter_alteracao_endereco:
    - text: "Certo! Digite seu novo endereço de entrega."

  utter_alteracao_data:
    - text: "Certo! Digite sua nova data de entrega."

  utter_alteracao_pagamento:
    - text: "Certo! Digite seu novo método de pagamento."

  utter_confirmar_alteracao:
    - text: "✅ Sua alteração foi realizada com sucesso!"
  
  utter_fazer_pagamento:
    - text: "Para realizar o pagamento, fale com o propietário Luiz: +55 55 9941-6442 ☺️​"

  utter_visualizar_pedidos:
    - text: |
        📦 Certo!

        Estamos localizando seus pedidos...

  utter_cancelar_pedido:
    - text: |
        Qual é o código do pedido que deseja cancelar? (digite com o #)

  utter_cancelar_pedido_confirmar:
    - text: |
        ✅ Ok, seu pedido foi cancelado com sucesso!

  utter_falar_empresa:
    - text: |
        Fale com o propietário Luiz: +55 55 9941-6442 👨‍🌾​🥚​

  utter_agradecimento:
    - text: |
        😊 Disponha!

        Posso ajudar em mais alguma coisa?

  utter_finalizacao:
    - text: |
        💛 Tenha um ótimo dia!

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: false