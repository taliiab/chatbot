    examples: |
      - Rua das Flores
      - Avenida Brasil
      - Av Paulista
      - Alameda dos Anjos
      - Minha rua é a Voluntários da Pátria

  - intent: informar_numero
    examples: |
      - número 123
      - n 45
      - 1020
      - o número é 789
      - código de cancelamento 204512
      - meu código é 154622
      - número do pedido 98374
      - pedido 180898
      - #180898          
      - #117712          
      - pedido #319398   
      - 180898

  - intent: informar_bairro
    examples: |
      - Centro
      - Jardim Botânico
      - Copacabana
