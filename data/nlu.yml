      - preciso alterar o [endereco](campo_alterar) de entrega
      - mude o [endereco](campo_alterar) por favor
      - quero mudar a [data](campo_alterar)
      - preciso alterar a [data](campo_alterar) de entrega
      - mude a [data](campo_alterar) do agendamento

  - intent: cancelar_pedido
    examples: |
      - quero cancelar meu pedido
      - cancelamento de pedido
      - excluir pedido
      - cancela para mim

  - intent: alterar_endereco_completo
    examples: |
      - quero mudar o endereço de entrega
      - trocar local de entrega
      - Rua das Palmeiras, 150, Centro
      - Av Paulista 1000, apto 32, Bela Vista
      - Mude para a Rua das Flores, 45, Bairro Novo

  - intent: informar_endereco
    examples: |
      - Meu endereço é 
      - Quero entregar na Avenida Central
      - O endereço de entrega é este
