version: "3.1"

nlu:
  - intent: saudacao
    examples: |
      - oi
      - olá
      - bom dia
      - boa tarde
      - tudo bem?

  - intent: finalizacao
    examples: |
      - tchau
      - adeus
      - obrigado, tchau
      - finalizar
      - encerrar
      - não, obrigada

  - intent: agradecimento
    examples: |
      - obrigado
      - obrigada
      - valeu
      - muito obrigado

  - intent: fazer_pedido
    examples: |
      - quero fazer um pedido
      - comprar ovos
      - fazer pedido
      - gostaria de encomendar

  - intent: visualizar_pedidos
    examples: |
      - ver meus pedidos
      - rastrear pedido
